kind: TaskDialog
modelDisplayName: Power BI top 100 agents by usage
modelDescription: ONLY for the exact unfiltered, undated top 100 agents by audited interactions across all available recorded history. NOT for last 30 days, explicit dates, categorical filters, other metrics or any other requested limit. Those requests are supported NOW by Model analytics; use metric interactions, groupBy agent, sortBy value, requested topN (default 20), and explicit dates or relativePeriod last30Days. Never call this fixed tool as an all-history substitute for a dated request. Fixed DAX and numbered top-100 result format are preserved. WindowStart/WindowEnd are observed-event bounds, not verified refresh timestamps or continuous coverage. No identities or transcripts are returned.
inputs:
  - kind: ManualTaskInput
    propertyName: groupid
    value: __WORKSPACE_ID__
  - kind: ManualTaskInput
    propertyName: datasetid
    value: __DATASET_ID__
  - kind: ManualTaskInput
    propertyName: query
    value: |-
      DEFINE
        VAR WindowStart = [First Interaction]
        VAR WindowEnd = [Last Interaction]
        VAR AgentUsage =
          FILTER(
            SUMMARIZECOLUMNS(
              'Agent'[AgentKey],
              'Agent'[AgentName],
              "InteractionCount", [Interactions]
            ),
            NOT ISBLANK('Agent'[AgentKey]) && [InteractionCount] > 0
          )
        VAR TopAgents =
          TOPN(100, AgentUsage, [InteractionCount], DESC, 'Agent'[AgentKey], ASC)
      EVALUATE
        SELECTCOLUMNS(
          TopAgents,
          "AgentKey", 'Agent'[AgentKey],
          "AgentName", 'Agent'[AgentName],
          "Interactions", [InteractionCount],
          "WindowStart", WindowStart,
          "WindowEnd", WindowEnd
        )
      ORDER BY [Interactions] DESC, [AgentKey] ASC
  - kind: ManualTaskInput
    propertyName: impersonatedUserName
    value: =Blank()
outputs:
  - propertyName: Response
action:
  kind: InvokeConnectorTaskAction
  connectionReference: __CONNECTION_REFERENCE__
  connectionProperties:
    mode: Invoker
  operationId: ExecuteDatasetQuery
outputMode: All
