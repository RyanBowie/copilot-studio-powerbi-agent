    text: Run the Power BI smoke test.



  - title: Governance counts

    text: How many agent rows and environment rows can I see?



  - title: Top 100 agents by usage

    text: Give me the top 100 agents by usage.



  - title: Explore model analytics

    text: Show interactions by platform for August 2026.



  - title: Write model-specific DAX

    text: Help me write DAX for sessions by month.



