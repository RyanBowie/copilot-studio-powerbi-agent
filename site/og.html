<!doctype html><html lang="en-GB" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>:root{--cp-bg:#171717;--cp-surface:#1f1f1f;--cp-border:#3b3b3b;--cp-text:#f2f2f2;--cp-text-muted:#bdbdbd;--cp-accent:#c3a0ef;--cp-chart-blue:#69aeff;--cp-chart-purple:#bc98ed;--cp-chart-magenta:#ed8fea}*{box-sizing:border-box}body{margin:0;width:1280px;height:640px;overflow:hidden;background:var(--cp-bg);color:var(--cp-text);font-family:"Segoe UI",Aptos,Calibri,sans-serif}.card{position:absolute;inset:44px;border:1px solid var(--cp-border);border-radius:36px;background:var(--cp-surface);padding:58px 64px}.k{color:var(--cp-accent);font:700 24px Consolas,"Courier New",monospace;letter-spacing:.1em;text-transform:uppercase}h1{margin:34px 0 22px;font-size:78px;line-height:1.02;letter-spacing:-.04em;background:linear-gradient(105deg,var(--cp-chart-blue),var(--cp-chart-purple) 56%,var(--cp-chart-magenta));-webkit-background-clip:text;background-clip:text;color:transparent}.lede{font-size:31px;line-height:1.3;max-width:980px;color:var(--cp-text-muted)}.foot{position:absolute;left:64px;right:64px;bottom:44px;display:flex;justify-content:space-between;color:var(--cp-text-muted);font-size:24px}.pill{color:var(--cp-accent)}</style><title>Copilot Studio + Power BI Agent</title></head><body><main class="card"><div class="k">Community project · MIT licence</div><h1>Copilot Studio + Power BI Agent</h1><p class="lede">Generate DAX, query Power BI semantic models as the signed-in user, and explain the answer.</p><div class="foot"><span>Standard Copilot Studio runtime</span><span class="pill">As-is, no SLA</span></div></main></body></html>
